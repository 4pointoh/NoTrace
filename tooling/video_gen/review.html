<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Library</title>
<style>
:root {
	--bg: #121316; --panel: #1c1e23; --line: #2c2f36; --text: #e7e8ea; --dim: #9a9ea8;
	--keep: #3fb26b; --reject: #d9534f; --star: #e3b341; --accent: #6ea8ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
	padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; }
header .stats { color: var(--dim); }
.filters button, .card button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
	border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.filters button.on { border-color: var(--accent); color: var(--accent); }
label.size { color: var(--dim); display: flex; gap: 6px; align-items: center; }
main { padding: 8px 16px 40px; }
section { margin: 18px 0 28px; }
section h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 12px; }
section h2 img { height: 72px; border-radius: 4px; border: 1px solid var(--line); }
section h2 .count { color: var(--dim); font-weight: normal; }
section.pic h2 img { height: 132px; }
section h2 button.pic { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-size: 12px;
	font-weight: normal; cursor: pointer; text-align: left; }
section h2 button.pic:hover { text-decoration: underline; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--w, 260px), 1fr)); gap: 12px; }
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.card.keep { border-color: var(--keep); }
.card.reject { border-color: var(--reject); opacity: .55; }
.card.prod { border-color: var(--star); }
.card .frame { position: relative; aspect-ratio: 3 / 4; background: #000; }
.card .frame img, .card .frame video { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
	object-fit: contain; }
.card .meta { padding: 8px 10px; display: grid; gap: 6px; }
.card .title { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; }
.card .title span { color: var(--dim); font-weight: normal; font-size: 12px; }
.card .note { color: var(--dim); font-size: 12px; }
.card details { font-size: 12px; color: var(--dim); }
.card details pre { white-space: pre-wrap; margin: 6px 0 0; font: 12px/1.35 ui-monospace, monospace; }
.card .actions { display: flex; flex-wrap: wrap; gap: 6px; }
.card .actions button { white-space: nowrap; }
.card .actions .k.on { background: var(--keep); border-color: var(--keep); color: #fff; }
.card .actions .r.on { background: var(--reject); border-color: var(--reject); color: #fff; }
.card .actions .s { margin-left: auto; }
.card .actions .s.on { background: var(--star); border-color: var(--star); color: #1a1a1a; }
.card textarea { width: 100%; min-height: 34px; resize: vertical; background: var(--bg); color: var(--text);
	border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; }
.q { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
	padding: 4px 8px; font: inherit; width: 170px; }
.empty { color: var(--dim); padding: 40px 0; }
@media (max-width: 600px) { header, main { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
	<h1>Video library</h1>
	<span class="stats" id="stats"></span>
	<span class="filters" id="filters">
		<button data-f="all" class="on">All</button>
		<button data-f="unreviewed">Unreviewed</button>
		<button data-f="keep">Keepers</button>
		<button data-f="prod">★ Production</button>
		<button data-f="norejects">Hide rejects</button>
		<button data-f="nostar" title="Only groups with no production clip yet (rejects hidden)">No ★ yet</button>
	</span>
	<span class="filters" id="grouping">
		<button data-g="key" class="on" title="One section per prompt (clip name)">By name</button>
		<button data-g="picture" title="One section per picture: every clip made from it, under its game art name">By picture</button>
	</span>
	<input type="search" id="q" placeholder="Filter by name" class="q">
	<label class="size">Size <input type="range" id="size" min="180" max="520" value="260"></label>
	<a href="/plan" style="color: var(--accent)">Plan page</a> <a href="/redo" style="color: var(--accent)">Before / after</a> <a href="/finish" style="color: var(--accent)">Upscale before / after</a>
	<span class="stats">Hover a clip to play it. K keep, S star as production-ready, R reject, U clear.</span>
</header>
<main id="main"><p class="empty">Loading…</p></main>
<script>
let data = { clips: [], review: {}, pending: [], pictures: {} };
let filter = 'all';
let grouping = 'key';  // or 'picture': one section per picture a clip animates (h3.py records it as clip.picture)
let query = decodeURIComponent(location.hash.slice(1)).toLowerCase();
let hovered = null;
// Every card shows a small still that h3.py serve makes. Only the last few clips hovered hold a <video>,
// plus any open with its controls. A loaded <video> for each clip near the screen still ran the browser
// out of memory: each one keeps a full-size decoder, and at small card sizes dozens fit on screen.
const LIVE = 3;
const videos = new Map();  // path -> <video>, least recently hovered first, kept across redraws
function thumb(path) { return '/thumbs/' + path.replace(/\.\w+$/, '.jpg'); }
function drop(path) {
	const video = videos.get(path);
	video.pause();
	video.removeAttribute('src');
	video.load();
	video.remove();
	videos.delete(path);
}
function live(clip, frame) {
	let video = videos.get(clip.path);
	if (video) videos.delete(clip.path);  // set again below, as the newest
	else {
		video = el('video', { src: clip.path, poster: thumb(clip.path), loop: '', playsinline: '' });
		video.muted = true;
		video.addEventListener('click', () => { video.controls = !video.controls; video.muted = !video.controls; });
	}
	videos.set(clip.path, video);
	if (video.parentNode !== frame) frame.append(video);
	for (const [path, v] of videos) {
		if (videos.size <= LIVE) break;
		if (path !== clip.path && !v.controls) drop(path);
	}
	return video;
}

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

async function load() {
	const r = await fetch('/api/clips');
	data = await r.json();
	render();
}

// Saves in flight, and a running count of saves, so a 15 s refresh that was sent before a save can't
// replace the page's state with a snapshot from before it.
let saving = 0, saves = 0, unsaved = false;
async function mark(path, fields, redraw = true) {
	data.review[path] = { ...(data.review[path] || {}), ...fields };
	saving++; saves++;
	let ok = false;
	try {
		const r = await fetch('/api/review', { method: 'POST', headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({ path, ...fields }) });
		ok = r.ok;
	} catch (e) {}
	saving--;
	if (unsaved !== !ok) { unsaved = !ok; redraw = true; }
	if (redraw) render();
}

// The star means production-ready: usable as is, a step above keep. A starred clip is always a keeper, so
// starring keeps it, and un-keeping or rejecting it takes the star away.
function setVerdict(path, verdict) {
	return mark(path, verdict === 'keep' ? { verdict } : { verdict, production: false });
}
function toggleStar(path) {
	const rv = data.review[path] || {};
	return mark(path, rv.production ? { production: false } : { production: true, verdict: 'keep' });
}

// Notes save as you type; a redraw would wipe the box mid-sentence, so none happens while one has focus.
let noteTimer = null;
function typing() { return document.activeElement && document.activeElement.tagName === 'TEXTAREA'; }

function visible(clip) {
	const rv = data.review[clip.path] || {};
	const v = rv.verdict || '';
	if (filter === 'unreviewed') return !v;
	if (filter === 'keep') return v === 'keep';
	if (filter === 'prod') return rv.production === true;
	if (filter === 'norejects' || filter === 'nostar') return v !== 'reject';
	return true;
}

// A picture's name is its file under data/background_lists (several when the game uses the same art twice).
// The server matches the pictures to the game art in the background after it starts, so until then a
// picture shows under its file in sources/.
function pictureName(pic) {
	const game = (data.pictures || {})[pic];
	if (game && game.length) return game.map(g => g.replace(/\.\w+$/, '')).join(' = ');
	if (!pic) return 'no picture recorded';
	return pic.replace(/^sources\//, '').replace(/_\d+x\d+\.png$/, '') + (game ? ' (not in the game art)' : '');
}
function setQuery(value) {
	query = value.trim().toLowerCase();
	q.value = value;
	history.replaceState(null, '', query ? '#' + encodeURIComponent(query) : location.pathname);
}
function setGrouping(value) {
	grouping = value;
	store('grouping', grouping);
	for (const x of document.querySelectorAll('#grouping button')) x.classList.toggle('on', x.dataset.g === grouping);
}
function showPicture(pic) {
	setGrouping('picture');
	setQuery(pictureName(pic));
	render();
	window.scrollTo(0, 0);
}

function el(tag, attrs = {}, ...kids) {
	const e = document.createElement(tag);
	for (const [k, v] of Object.entries(attrs)) {
		if (k === 'class') e.className = v;
		else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
		else e.setAttribute(k, v);
	}
	for (const kid of kids) if (kid != null) e.append(kid);
	return e;
}

function card(clip) {
	const rv = data.review[clip.path] || {};
	const frame = el('div', { class: 'frame' },
		el('img', { src: thumb(clip.path), alt: '', loading: 'lazy', decoding: 'async' }), videos.get(clip.path));
	const c = el('div', { class: 'card ' + (rv.verdict || '') + (rv.production ? ' prod' : '') });
	c.addEventListener('mouseenter', () => { hovered = clip; live(clip, frame).play().catch(() => {}); });
	c.addEventListener('mouseleave', () => {
		if (hovered === clip) hovered = null;
		const video = videos.get(clip.path);
		if (video) video.pause();
	});
	const name = clip.file.replace(/\.mp4$/, '');
	const facts = [`seed ${clip.seed}`, `${clip.frames}f`, `${clip.steps} steps`,
		clip.seconds_to_make ? `${Math.round(clip.seconds_to_make)} s` : null,
		(clip.loras || []).length ? `${clip.loras.length} LoRA` : null].filter(Boolean).join(' · ');
	const notes = el('textarea', { placeholder: 'Notes' });
	notes.value = rv.note || '';
	notes.addEventListener('input', () => {
		clearTimeout(noteTimer);
		noteTimer = setTimeout(() => mark(clip.path, { note: notes.value }, false), 500);
	});
	notes.addEventListener('blur', () => { clearTimeout(noteTimer); mark(clip.path, { note: notes.value }, false); });
	c.append(frame, el('div', { class: 'meta' },
		el('div', { class: 'title' }, name, el('span', {}, facts)),
		clip.note ? el('div', { class: 'note' }, clip.note) : null,
		el('div', { class: 'actions' },
			el('button', { class: 'k' + (rv.verdict === 'keep' ? ' on' : ''), onclick: () => setVerdict(clip.path, rv.verdict === 'keep' ? '' : 'keep') }, 'Keep'),
			el('button', { class: 'r' + (rv.verdict === 'reject' ? ' on' : ''), onclick: () => setVerdict(clip.path, rv.verdict === 'reject' ? '' : 'reject') }, 'Reject'),
			el('button', { class: 's' + (rv.production ? ' on' : ''), title: 'Production-ready: usable as is (S)', onclick: () => toggleStar(clip.path) }, rv.production ? '★ Production' : '☆ Production')),
		notes,
		el('details', {}, el('summary', {}, 'Prompt'), el('pre', {}, clip.prompt))));
	return c;
}

function render() {
	const main = document.getElementById('main');
	main.textContent = '';
	const byPicture = grouping === 'picture';
	const kept = c => (data.review[c.path] || {}).verdict === 'keep';
	const starred = c => (data.review[c.path] || {}).production === true;
	const groups = {}, perPicture = {};
	for (const clip of data.clips) {
		const g = byPicture ? clip.picture : clip.key;
		(groups[g] = groups[g] || []).push(clip);
		(perPicture[clip.picture] = perPicture[clip.picture] || []).push(clip);
	}
	const pictures = Object.values(perPicture);
	document.getElementById('stats').textContent = (unsaved ? '⚠ Last change not saved: is h3.py serve running? · ' : '') +
		`${data.clips.length} clips · ${data.clips.filter(kept).length} kept · ${data.clips.filter(starred).length} production · ` +
		`${data.clips.filter(c => (data.review[c.path] || {}).verdict === 'reject').length} rejected · ` +
		`${pictures.length} pictures, ${pictures.filter(cs => cs.some(starred)).length} with ★ · ${data.pending.length} still on the pod`;
	const order = Object.keys(groups).map(g => [g, byPicture ? pictureName(g) : g]).sort((a, b) => a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0);
	let shown = 0;
	for (const [g, label] of order) {
		const all = groups[g], pic = all[0].picture;
		const keys = [...new Set(all.map(c => c.key))];
		// by name, a search matches the clip name; by picture, the picture's name or any of its clip names
		if (query && ![label, ...(byPicture ? keys : [])].some(s => s.toLowerCase().includes(query))) continue;
		if (filter === 'nostar' && all.some(starred)) continue;
		const clips = all.filter(visible);
		if (!clips.length) continue;
		shown += clips.length;
		const stars = all.filter(starred).length;
		const counts = `${all.length} ${byPicture ? (all.length === 1 ? 'clip' : 'clips') : (all.length === 1 ? 'try' : 'tries')}, ${all.filter(kept).length} kept` +
			(stars ? `, ★ ${stars} production` : '') + (byPicture && keys.length > 1 ? ` · ${keys.length} names` : '');
		const others = perPicture[pic].length - all.length;
		main.append(el('section', { class: byPicture ? 'pic' : '' },
			el('h2', {}, pic ? el('img', { src: thumb(pic), alt: '', loading: 'lazy', decoding: 'async' }) : null,
				el('div', {}, label, ' ', el('span', { class: 'count' }, counts),
					byPicture ? null : el('div', {}, el('button', { class: 'pic', title: 'Every clip made from this picture',
						onclick: () => showPicture(pic) }, pictureName(pic) + (others ? ` · all ${perPicture[pic].length} clips of this picture →` : ''))))),
			el('div', { class: 'grid' }, ...clips.map(card))));
	}
	if (!shown) main.append(el('p', { class: 'empty' }, data.clips.length ? 'Nothing matches this filter.' : 'No clips yet.'));
	for (const [path, video] of videos) if (!video.isConnected) drop(path);
}

document.getElementById('filters').addEventListener('click', e => {
	const b = e.target.closest('button');
	if (!b) return;
	filter = b.dataset.f;
	store('filter', filter);
	for (const x of document.querySelectorAll('#filters button')) x.classList.toggle('on', x === b);
	render();
});
document.getElementById('grouping').addEventListener('click', e => {
	const b = e.target.closest('button');
	if (!b) return;
	setGrouping(b.dataset.g);
	render();
});
const q = document.getElementById('q');
q.value = query;
q.addEventListener('input', () => {
	setQuery(q.value);
	render();
});
const size = document.getElementById('size');
size.addEventListener('input', () => { document.body.style.setProperty('--w', size.value + 'px'); store('size', size.value); });
document.addEventListener('keydown', e => {
	// not while typing (notes, the search box) or with a modifier, so Ctrl+S or Ctrl+R never marks a clip
	// and not on key repeat: S toggles, so holding it would flip the star back and forth
	if (!hovered || ['TEXTAREA', 'INPUT'].includes(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
	const k = e.key.toLowerCase();
	if (k === 'k') setVerdict(hovered.path, 'keep');
	else if (k === 's') toggleStar(hovered.path);
	else if (k === 'r') setVerdict(hovered.path, 'reject');
	else if (k === 'u') setVerdict(hovered.path, '');
});
const savedSize = recall('size');
if (savedSize) { size.value = savedSize; document.body.style.setProperty('--w', savedSize + 'px'); }
const savedFilter = recall('filter');
if (savedFilter) { filter = savedFilter; for (const x of document.querySelectorAll('#filters button')) x.classList.toggle('on', x.dataset.f === filter); }
if (recall('grouping') === 'picture') setGrouping('picture');
load();
setInterval(() => {
	if (document.hidden || typing() || saving) return;
	const sent = saves;
	fetch('/api/clips').then(r => r.json()).then(d => {
		if (saving || saves !== sent || typing()) return;  // a save happened meanwhile: this snapshot may predate it
		if (d.clips.length !== data.clips.length || d.pending.length !== data.pending.length ||
			Object.keys(d.pictures || {}).length !== Object.keys(data.pictures || {}).length) { data = d; render(); }
	}).catch(() => {});
}, 15000);
</script>
</body>
</html>
