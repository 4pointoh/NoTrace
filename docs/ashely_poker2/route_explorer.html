<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashely II Routes</title>
<!--
  Ashely Poker II's race, to click through: the stake menus, what each choice leads to, every scene
  and ending, and what you have seen so far. The rules are a copy of
  data/scripts/ashely_poker2/ashely2_race.gd (between ENGINE START and ENGINE END below); keep the two
  in step. The pictures come straight from the game's folders (data/background_lists/ashely_poker2/),
  so open this file where it is, in the project. What you have seen is kept in this browser.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f3efe6; --panel: #fffdf8; --panel-2: #f1ebdf; --ink: #1c2321; --ink-2: #5d6965; --line: #ded5c4;
  --accent: #1f8a7e; --accent-ink: #ffffff;
  --shadow: 0 1px 2px rgb(0 0 0 / .05), 0 10px 28px rgb(60 45 15 / .07);
  --strip: #1f9a8c; --sexy: #d8466e; --love: #c98410; --mr: #7258d8; --her: #4170d0; --end: #6e7c78; --good: #2f8f55;
  --seen-bg: #e2f2e7; --seen-ink: #1f6b3f; --veil: rgb(18 22 20 / .9);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1214; --panel: #161c1f; --panel-2: #1d2529; --ink: #ecf0ee; --ink-2: #93a19c; --line: #2a3438;
    --accent: #3cc2b1; --accent-ink: #062420;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .35);
    --strip: #3cc2b1; --sexy: #f0628a; --love: #f0b04a; --mr: #9d85f5; --her: #6e97f0; --end: #8d9b97; --good: #4cc27c;
    --seen-bg: #173222; --seen-ink: #8fe0ad; --veil: rgb(4 6 6 / .92);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1214; --panel: #161c1f; --panel-2: #1d2529; --ink: #ecf0ee; --ink-2: #93a19c; --line: #2a3438;
  --accent: #3cc2b1; --accent-ink: #062420;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .35);
  --strip: #3cc2b1; --sexy: #f0628a; --love: #f0b04a; --mr: #9d85f5; --her: #6e97f0; --end: #8d9b97; --good: #4cc27c;
  --seen-bg: #173222; --seen-ink: #8fe0ad; --veil: rgb(4 6 6 / .92);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
button { font: inherit; color: inherit; }
.serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
.muted { color: var(--ink-2); }
.mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12px; }

/* --- header */
header {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
}
.bar { max-width: 1320px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.brand { display: flex; flex-direction: column; line-height: 1.15; }
.brand b { font-size: 20px; font-weight: 600; letter-spacing: .2px; }
.brand span { font-size: 12px; color: var(--ink-2); }
.tabs { display: flex; gap: 4px; background: var(--panel-2); padding: 4px; border-radius: 12px; }
.tab { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; cursor: pointer; color: var(--ink-2); font-weight: 600; }
.tab[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.tab small { font-weight: 500; opacity: .8; margin-left: 4px; }
@media (max-width: 700px) { header { position: static; } }
.proposals { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; }
.proposals > span { color: var(--ink-2); font-size: 12px; text-transform: uppercase; letter-spacing: .8px; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 20px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; flex: none; }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); transition: left .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .3); }
.switch input:checked { background: var(--mr); }
.switch input:checked::after { left: 17px; }
.switch input:focus-visible { outline: 2px solid var(--mr); outline-offset: 2px; }
.switch select { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; cursor: pointer; }
.switch select:focus-visible { outline: 2px solid var(--mr); outline-offset: 2px; }

main { max-width: 1320px; margin: 0 auto; padding: 18px 16px 60px; }
.banner { background: color-mix(in srgb, var(--sexy) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--sexy) 40%, var(--line)); padding: 10px 14px; border-radius: 12px; margin-bottom: 16px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.pad { padding: 20px; }
h2 { margin: 0 0 4px; font-size: 26px; font-weight: 600; }
h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .9px; color: var(--ink-2); font-weight: 700; }
p { margin: 0 0 10px; }

.btn {
  border: 1px solid var(--line); background: var(--panel-2); padding: 9px 16px; border-radius: 11px; cursor: pointer;
  font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .opt:focus-visible, .node:focus-visible, .hist button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.her { background: var(--her); border-color: var(--her); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn[disabled] { opacity: .45; cursor: default; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; letter-spacing: .3px; padding: 2px 8px; border-radius: 99px; background: var(--panel-2); color: var(--ink-2); white-space: nowrap; }
.pill.new { background: color-mix(in srgb, var(--love) 22%, var(--panel)); color: var(--love); }
.pill.seen { background: var(--seen-bg); color: var(--seen-ink); }
.pill.proposal { background: color-mix(in srgb, var(--mr) 18%, var(--panel)); color: var(--mr); }
.pill.warn { background: color-mix(in srgb, var(--sexy) 16%, var(--panel)); color: var(--sexy); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--end); }
.c-strip { --c: var(--strip); } .c-sexy { --c: var(--sexy); } .c-love { --c: var(--love); } .c-mr { --c: var(--mr); }
.c-her { --c: var(--her); } .c-end { --c: var(--end); } .c-start { --c: var(--accent); }
.dot[class*="c-"] { background: var(--c); }
.pill.ladder { background: color-mix(in srgb, var(--c) 16%, var(--panel)); color: var(--c); }

/* pictures */
.pic { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 22%; background: var(--panel-2); }
.noart {
  width: 100%; height: 100%; display: grid; place-items: center; text-align: center; padding: 8px;
  background: repeating-linear-gradient(135deg, var(--panel-2) 0 10px, color-mix(in srgb, var(--panel-2) 70%, var(--line)) 10px 20px);
  color: var(--ink-2); font-size: 12px; font-weight: 600;
}

/* --- play */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 350px; gap: 20px; align-items: start; }
@media (max-width: 960px) { .play { grid-template-columns: minmax(0, 1fr); } }
.stagehead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-bottom: 4px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--c, var(--ink-2)); }
.match { display: grid; grid-template-columns: minmax(180px, 300px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 640px) { .match { grid-template-columns: minmax(0, 1fr); } }
.frame { aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); position: relative; background: var(--panel-2); }
.score { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; margin: 14px 0 18px; }
.pips { display: flex; gap: 6px; }
.pip { width: 26px; height: 8px; border-radius: 8px; background: var(--line); }
.pip.on { background: var(--c); }
.choices { display: grid; gap: 10px; }
.choice { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.choice .hint { font-size: 13px; color: var(--ink-2); }

.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin-top: 14px; }
.opt {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; text-align: left; cursor: pointer;
  border: 1px solid var(--line); border-left: 4px solid var(--c); background: var(--panel); border-radius: 14px; padding: 10px; transition: transform .1s, box-shadow .15s, border-color .15s;
}
.opt:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--c) 50%, var(--line)); border-left-color: var(--c); }
.opt .thumb { width: 96px; aspect-ratio: 3 / 4; border-radius: 9px; overflow: hidden; }
.opt .label { display: block; font-size: 17px; font-weight: 600; line-height: 1.25; margin: 2px 0 4px; }
.opt .plays { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
.opt .tags { display: flex; flex-wrap: wrap; gap: 4px; }
.opt .tags .pill { white-space: normal; }
.opt.mystery { cursor: default; }
.opt.mystery:hover { transform: none; box-shadow: none; border-color: var(--line); border-left-color: var(--c); }
.opt.mystery .noart { font-size: 40px; font-family: Georgia, serif; }
.unlock { padding: 10px 0; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.unlockhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.need { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; align-items: center; margin-top: 4px; }
.req { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; text-align: left; border: 0; background: none; padding: 4px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.req:hover { background: var(--panel-2); }
.req.done { color: var(--ink); }
.req .box { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.req.done .box { background: var(--good); border-color: var(--good); color: #fff; }
.lastcall { margin-top: 14px; padding: 10px 14px; border-radius: 12px; background: color-mix(in srgb, var(--love) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--love) 35%, var(--line)); font-size: 14px; }
details.off { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
details.off summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }
.offlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.offlist li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14px; }
.offlist li.out { opacity: .6; }
.offlist .why { color: var(--ink-2); }

/* a scene: its picture large on the left, what it is and what comes next on the right */
.scene { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(250px, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .scene { grid-template-columns: minmax(0, 1fr); } }
.scene .info { display: grid; gap: 4px; align-content: start; }
.big { position: relative; width: min(100%, calc((100vh - 150px) * 3 / 4)); margin: 0 auto; }
.big .frame { cursor: zoom-in; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 6px; margin: 8px 0 4px; }
.thumbs button { aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--panel-2); opacity: .65; }
.thumbs button.on { border-color: var(--accent); opacity: 1; }
.thumbs button:hover { opacity: 1; }
.big .pic { object-fit: contain; object-position: center; }
.navbtn {
  position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgb(0 0 0 / .45); color: #fff; font-size: 22px; line-height: 40px; display: grid; place-items: center;
}
.navbtn.prev { left: 10px; } .navbtn.next { right: 10px; }
.count { position: absolute; bottom: 10px; right: 10px; background: rgb(0 0 0 / .55); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.strip button { flex: none; width: 58px; aspect-ratio: 3 / 4; border-radius: 8px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--panel-2); opacity: .7; }
.strip button.on { border-color: var(--accent); opacity: 1; }
.strip button:hover { opacity: 1; }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.runchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.outcome { margin: 12px 0; padding: 12px 14px; border-radius: 12px; background: var(--panel-2); }

/* sidebar */
.side { display: grid; gap: 14px; }
.side .card { padding: 16px; }
.status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.status .num { font-size: 28px; font-weight: 600; line-height: 1; }
.status .num small { font-size: 14px; color: var(--ink-2); font-weight: 500; }
.ladders { display: grid; gap: 12px; }
.lrow .lname { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
.lrow .lname small { color: var(--ink-2); font-weight: 600; margin-left: auto; }
.nodes { display: flex; align-items: flex-start; position: relative; }
.nodes::before { content: ""; position: absolute; left: 22px; right: 22px; top: 21px; height: 2px; background: var(--line); }
.node { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; position: relative; min-width: 0; }
.node .ring { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; border: 2px solid var(--line); background: var(--panel-2); position: relative; }
.node .ring .pic { object-position: center 18%; }
.node .ring .noart { font-size: 0; }
.node .cap { font-size: 10.5px; line-height: 1.15; color: var(--ink-2); text-align: center; max-width: 72px; }
.node.taken .ring { border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 30%, transparent); }
.node.taken .cap { color: var(--ink); font-weight: 600; }
.node.next .ring { border: 2px dashed var(--c); animation: glow 1.8s ease-in-out infinite; }
.node.later .ring { opacity: .8; }
.node.out .ring { filter: grayscale(1); opacity: .3; }
.node.out .cap { text-decoration: line-through; opacity: .6; }
.node .tick { position: absolute; top: -2px; right: calc(50% - 26px); width: 16px; height: 16px; border-radius: 50%; background: var(--c); color: #fff; font-size: 10px; display: grid; place-items: center; font-weight: 800; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 0%, transparent); } 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--c) 28%, transparent); } }
@media (prefers-reduced-motion: reduce) { .node.next .ring { animation: none; } .opt, .btn { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--ink-2); margin-top: 10px; }
.hist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; counter-reset: h; }
.hist button { width: 100%; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 9px; cursor: pointer; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: center; font-size: 13.5px; }
.hist button:hover { background: var(--panel-2); }
.hist button.on { background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.hist .when { color: var(--ink-2); font-size: 11.5px; }

/* --- scenes */
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-bottom: 18px; }
.meter { flex: 1 1 260px; height: 10px; border-radius: 10px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--good); border-radius: 10px; }
.filters { display: flex; gap: 6px; }
.filters .btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.group { margin: 26px 0 10px; display: flex; align-items: baseline; gap: 10px; }
.group h3 { margin: 0; color: var(--c); }
.group span { font-size: 13px; color: var(--ink-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 14px; }
.scard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; border-top: 3px solid var(--c); }
.scard .cover { aspect-ratio: 3 / 4; position: relative; cursor: zoom-in; border: 0; padding: 0; background: var(--panel-2); width: 100%; display: block; }
.scard.unseen .cover .pic { filter: grayscale(.85) brightness(.75); }
.scard.unseen .cover:hover .pic { filter: none; }
.scard .flag { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.scard .body { padding: 10px 12px 12px; display: grid; gap: 4px; flex: 1; align-content: start; }
.scard .t { font-weight: 600; line-height: 1.25; }
.scard .reach { font-size: 12px; color: var(--ink-2); }
.scard .act { margin-top: 6px; }
.grid.removed .scard { opacity: .5; }

/* --- routes */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 22px; }
.stat { padding: 14px 16px; }
.stat b { display: block; font-size: 28px; font-weight: 600; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--ink-2); }
.endings { display: grid; gap: 12px; }
.ending { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px; border-left: 4px solid var(--c); }
@media (max-width: 640px) { .ending { grid-template-columns: 64px minmax(0, 1fr); } .ending .go { grid-column: 1 / -1; } }
.ending .thumb { aspect-ratio: 3 / 4; border-radius: 9px; overflow: hidden; border: 0; padding: 0; cursor: zoom-in; width: 100%; }
.share { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin: 4px 0 8px; }
.share .meter { flex: 0 1 220px; height: 7px; }
.share .meter i { background: var(--c); }
.sets { display: flex; flex-wrap: wrap; gap: 6px; }
.set { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; padding: 3px 6px; border-radius: 9px; background: var(--panel-2); font-size: 12px; }
.set em { font-style: normal; color: var(--ink-2); margin-left: 4px; }
.chip { display: inline-block; padding: 1px 7px; border-radius: 7px; font-size: 12px; font-weight: 600; background: color-mix(in srgb, var(--c) 17%, var(--panel)); color: var(--c); }
.freq { display: grid; gap: 6px; }
.frow { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 64px; gap: 12px; align-items: center; font-size: 13.5px; }
@media (max-width: 640px) { .frow { grid-template-columns: minmax(0, 1fr) 56px; } .frow .meter { display: none; } }
.frow .meter { height: 8px; }
.frow .meter i { background: var(--c); }
.frow .pct { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.explain { max-width: 820px; color: var(--ink-2); margin-bottom: 18px; }

/* --- lightbox */
.lightbox { position: fixed; inset: 0; z-index: 50; background: var(--veil); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: 14px; color: #fff; }
.lightbox[hidden] { display: none; }
.lightbox .top { display: flex; align-items: center; gap: 12px; max-width: 1100px; width: 100%; margin: 0 auto; }
.lightbox .top b { font-size: 17px; }
.lightbox .top .btn { margin-left: auto; background: rgb(255 255 255 / .12); border-color: transparent; color: #fff; }
.lightbox .stage { position: relative; display: grid; place-items: center; min-height: 0; }
.lightbox .stage img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
.lightbox .stage .noart { max-width: 360px; aspect-ratio: 3 / 4; height: auto; border-radius: 10px; }
.lightbox .strip { justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto; }
</style>
</head>
<body>
<header><div class="bar" id="bar"></div></header>
<main id="main"></main>
<div class="lightbox" id="lightbox" hidden></div>

<script>
'use strict';

// ENGINE START
// A copy of data/scripts/ashely_poker2/ashely2_race.gd. A race is its story flags, as the game keeps

// --- what the race can do: every state, how many races pass through it, the shortest way to each scene

const OPTION_ORDER = ['S1_TOP', 'S2_WALK', 'S3_SHORTS', 'S4_PANTIES', 'X1_BUTT', 'X2_BREAST', 'X3_BJ', 'X3_UNDER', 'X4_SEX', 'X4_BJ', 'L1_TRUTH', 'L2_NICE', 'L3_SMILE', 'L4_KISS', 'MR1_KISS', 'MR1_NICE', 'MR1_FINGER', 'MR3_INSPECT'];

function analyze(engine) {
  const start = newRace();
  const startKey = engine.stateKey(start);
  const nodes = new Map([[startKey, { key: startKey, state: start, parent: null, edges: [] }]]);
  const order = [];
  const queue = [startKey];
  // Every match adds one win to someone, so breadth-first order is also the order races run in.
  while (queue.length) {
    const node = nodes.get(queue.shift());
    order.push(node);
    const s = node.state;
    node.over = engine.isOver(s);
    node.appearance = engine.appearance(s);
    if (node.over) {
      node.ending = engine.endingKey(s);
      node.outcome = engine.outcome(s);
      continue;
    }
    const moves = engine.stakeMenu(s).map(entry => ({ t: 'win', key: entry.key })).concat([{ t: 'lose' }]);
    for (const action of moves) {
      const result = engine.apply(s, action);
      const to = engine.stateKey(result.state);
      if (!nodes.has(to)) {
        nodes.set(to, { key: to, state: result.state, parent: { from: node.key, action }, edges: [] });
        queue.push(to);
      }
      node.edges.push({ action, scene: result.scene, to });
    }
  }

  const pathsTo = new Map([[startKey, 1]]);
  for (const node of order) {
    const paths = pathsTo.get(node.key) || 0;
    for (const edge of node.edges) pathsTo.set(edge.to, (pathsTo.get(edge.to) || 0) + paths);
  }
  const racesFrom = new Map();
  for (let i = order.length - 1; i >= 0; i--) {
    const node = order[i];
    racesFrom.set(node.key, node.over ? 1 : node.edges.reduce((n, edge) => n + racesFrom.get(edge.to), 0));
  }
  const total = racesFrom.get(startKey);
  const routeTo = key => {
    const actions = [];
    for (let node = nodes.get(key); node.parent; node = nodes.get(node.parent.from)) actions.unshift(node.parent.action);
    return actions;
  };

  // How many races include each scene, and the shortest race to it.
  const sceneRaces = {};
  const routes = { INTRO_WAGER: { actions: [], view: 'intro' } };
  const count = (key, n) => { sceneRaces[key] = (sceneRaces[key] || 0) + n; };
  count('INTRO_WAGER', total);
  count('TABLE__' + nodes.get(startKey).appearance, total);
  routes['TABLE__' + nodes.get(startKey).appearance] = { actions: [], view: 'match' };
  const endings = {};
  const pickSets = new Set();
  for (const node of order) {
    const paths = pathsTo.get(node.key);
    if (node.over) {
      count(node.ending, paths);
      routes[node.ending] ??= { actions: routeTo(node.key), view: 'ending' };
      if (node.outcome.benchGirl) {
        count('PHONE_BENCH_GIRL', paths);
        routes.PHONE_BENCH_GIRL ??= { actions: routeTo(node.key), view: 'ending' };
      }
      const set = OPTION_ORDER.filter(option => node.state.flags.has(PICK + option)).join(' ');
      pickSets.add(set);
      const ending = endings[node.ending] ??= { races: 0, sets: new Map() };
      ending.races += paths;
      ending.sets.set(set, (ending.sets.get(set) || 0) + paths);
      continue;
    }
    for (const edge of node.edges) {
      const child = nodes.get(edge.to);
      const through = paths * racesFrom.get(edge.to);
      if (edge.scene) {
        count(edge.scene, through);
        routes[edge.scene] ??= { actions: [...routeTo(node.key), edge.action], view: 'scene' };
      }
      // Her outfit only ever comes off, so a race first sits at a new table once.
      if (!child.over && child.appearance !== node.appearance) {
        const table = 'TABLE__' + child.appearance;
        count(table, through);
        routes[table] ??= { actions: [...routeTo(node.key), edge.action], view: 'match' };
      }
    }
  }
  return { total, states: nodes.size, sceneRaces, routes, endings, pickSets: pickSets.size };
}

function replay(engine, actions) {
  let state = newRace();
  const steps = [];
  for (let i = 0; i < actions.length; i++) {
    const result = engine.apply(state, actions[i]);
    if (!result) return { state, steps, invalidAt: i };
    steps.push({ action: actions[i], before: state, after: result.state, scene: result.scene, item: result.item || null });
    state = result.state;
  }
  return { state, steps, invalidAt: -1 };
}

const PIC_ROOT = '../../data/background_lists/ashely_poker2/';

// A folder's pictures (01.webp, 02.webp, ... up to the first missing one), or null while looking.
function folderPictures(folder) {
  if (probes.has(folder)) return probes.get(folder);
  probes.set(folder, null);
  const found = [];
  const BATCH = 12;
  const look = from => Promise.all(Array.from({ length: BATCH }, (_, i) => new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = numbered(folder, from + i);
  }))).then(ok => {
    for (let i = 0; i < BATCH; i++) {
      if (!ok[i]) return done();
      found.push(numbered(folder, from + i));
    }
    return look(from + BATCH);
  });
  const done = () => { probes.set(folder, found); scheduleRender(); };
  look(1);
  return null;
}

// What a scene shows: { urls } (null while looking), with placeholder: true for its stand-in.
function scenePictures(key) {
  const scene = SCENES[key];
  if (!scene || scene.noArt) return { urls: [] };
  const folder = scene.from || scene.folder || key;
  const list = folderPictures(folder);
  if (list === null) return { urls: null };
  if (!list.length) return { urls: [placeholderOf(folder)], placeholder: true };
  return { urls: scene.from ? [list[list.length - 1]] : list };
}

function noArt(text = 'No art yet') {

// A scene's cover picture, falling back to its placeholder, then to a plain tile.
function cover(key) {

  if (!scene || scene.noArt) return noArt(scene?.proposal ? 'Proposed: no art' : 'No art yet');
  if (scene.from) {

    if (!pictures.urls) return noArt('…');
    return img(pictures.urls[0], [placeholderOf(scene.from)]);
  }
  const folder = scene.folder || key;
  return img(numbered(folder, 1), [placeholderOf(folder)]);
}

  return `<img class="pic" loading="lazy" decoding="async" alt="${esc(alt)}" src="${esc(src)}" data-fb="${esc(fallbacks.join('|'))}" onerror="pictureFailed(this)">`;
}

      const ending = engine.endingKey(engine.takeStake(s, entry.key));
      tags.push(`<span class="pill ladder c-end">ends: ${esc(titleOf(ending))}</span>`);
    }
    return `
      <button class="opt c-${sceneColor(entry.key)}" data-act="pick" data-arg="${entry.key}">
        <span class="thumb">${cover(entry.key)}</span>
        <span><span class="label serif">“${esc(entry.label)}”</span>
          <span class="plays">plays: ${esc(titleOf(entry.key))}</span>
          <span class="tags">${tags.join('')}</span></span>
      </button>${lockedAfter(entry, s)}`;
  }).join('');
  const off = offMenu(s, menu);
  const last = win === STAKES_TO_FINISH ? `<div class="lastcall">This is your last stake: whatever you pick, she forfeits after it, and the race ends.</div>` : '';
  return `
    <div class="stagehead"><span class="kicker c-strip">You won match ${run.steps.length + 1}</span></div>
    <h2 class="serif">Your stake <span class="muted" style="font-size:18px">· your ${ordinal(win)} of 4</span></h2>
    ${last}
    <div class="menu">${options}</div>
    <details class="off" ${off.length ? '' : 'hidden'}><summary>Not on the menu (${off.length})</summary>
      <ul class="offlist">${off.map(item => `<li class="${item.out ? 'out' : ''}"><span class="chip c-${item.ladder}">${esc(item.label)}</span><span class="why">${esc(item.why)}</span></li>`).join('')}</ul>
    </details>
    <div class="foot"><button class="btn ghost small" data-act="back">← Back</button><span class="muted" style="font-size:13px">The menu shows each ladder’s next rung, plus any mini-route that’s open.</span></div>`;
}

// Proposed: a finale not unlocked yet sits on the menu as a plain [?] that can't be picked.
function lockedAfter(entry, s) {
  if (ui.rules.bj !== 'unlocks') return '';
  const unlocked = unlockedNow();
  const locked = (entry.option === 'X4_BJ' && !unlocked.sex) || (entry.option === 'X3_UNDER' && engine.picked(s, 'S1_TOP') && !unlocked.toplessBlowjob);
  return locked ? `<div class="opt c-end mystery" aria-label="A locked stake"><span class="thumb"><span class="noart">?</span></span><span><span class="label serif">[?]</span></span></div>` : '';
}

// Why the other stakes aren't offered right now.
function offMenu(s, menu) {
  const out = [];
  const offered = new Set(menu.map(entry => entry.option));
  const winsLeft = STAKES_TO_FINISH - engine.yourWins(s);
  const win = engine.yourWins(s) + 1;
  for (const ladder of ladders()) {
    const next = ladder.rungs.findIndex(([option]) => !engine.picked(s, option));
    if (next < 0) continue;
    ladder.rungs.forEach(([option, label], i) => {
      if (i < next || engine.picked(s, option) || offered.has(option)) return;
      if (i === next) {
        const why = engine.toplessBlowjob(s, option) ? 'Once her top is off, this rung is her blowjob instead (proposed).'
          : ui.rules.love && option === 'L2_NICE' ? 'Not beside an MR1 kiss (proposed).'
          : 'Not offered after the MR1 kiss (the proposed MR1 menu).';
        out.push({ ladder: ladder.id, label, why, out: engine.toplessBlowjob(s, option) || (!!ui.rules.mr1 && !(ui.rules.love && option === 'L2_NICE')) });
        return;
      }
      const need = i - next + 1;
      const reach = need > winsLeft ? ` Out of reach this race: it needs ${need} more stakes, and you have ${winsLeft} left.` : '';
      out.push({ ladder: ladder.id, label, why: `Comes after “${ladder.rungs[i - 1][1]}”.${reach}`, out: need > winsLeft });
    });
  }
  const bra = s.flags.has(BRA_SIZE_TRUTH);
  const mr1Gone = win > 3 || engine.picked(s, 'S3_SHORTS') || (engine.picked(s, 'L1_TRUTH') && !bra);
  if (!engine.picked(s, 'MR1_KISS') && !offered.has('MR1_KISS')) {
    const needs = [];
    if (!engine.picked(s, 'S1_TOP')) needs.push('her top off');
    if (!bra) needs.push('then her bra-size truth (“Tell me a truth” while she’s topless)');
    const missing = needs.length;
    const out2 = mr1Gone || missing > 3 - win;
    const when = win > 3 ? 'It was only open at your 3rd stake.' : win === 3 ? 'Only at your 3rd stake, which is this one.' : `Only at your 3rd stake; this is your ${ordinal(win)}.`;
    const why = [when];
    if (needs.length) why.push('Needs ' + needs.join(', ') + '.');
    if (engine.picked(s, 'S3_SHORTS')) why.push('Her shorts must still be on.');
    if (engine.picked(s, 'L1_TRUTH') && !bra) why.push('Her truth was the dressed one, so the bra-size truth can’t happen now.');
    out.push({ ladder: 'mr', label: 'Kiss me', why: 'Mini-route 1. ' + why.join(' '), out: out2 });
  }
  if (!engine.picked(s, 'MR1_FINGER') && !offered.has('MR1_FINGER')) {
    const hasKiss = engine.picked(s, 'MR1_KISS');
    const kissOpen = offered.has('MR1_KISS');
    out.push({ ladder: 'mr', label: 'Kiss me like you mean it', why: hasKiss ? 'Mini-route 1’s finale: at your 4th stake.' : 'Mini-route 1’s finale: at your 4th stake, after the MR1 kiss.', out: !hasKiss && !kissOpen && (mr1Gone || win >= 3) });
  }
  if (!engine.picked(s, 'MR3_INSPECT') && !(engine.picked(s, 'X1_BUTT') && engine.picked(s, 'X2_BREAST') && engine.picked(s, 'X3_UNDER'))) {
    out.push(engine.punished(s, 'P2')
      ? { ladder: 'mr', label: 'Her inspection', why: 'Mini-route 3 is waiting: the next touch you ask for becomes her inspection.', out: false }
      : { ladder: 'mr', label: 'Her inspection', why: 'Mini-route 3: after her 2nd win (the dick pic), the next touch you ask for becomes her inspection.', out: engine.herWins(s) >= 2 });
  }
  return out;
}

function sceneCard(run, step) {
  const key = step.scene;
  const index = run.steps.indexOf(step);
  const scene = SCENES[key];
  const won = step.action.t === 'win';
  const over = engine.isOver(run.state);
  const kicker = won ? `Match ${index + 1} · your ${ordinal(engine.yourWins(step.after))} stake` : `Match ${index + 1} · her ${ordinal(engine.herWins(step.after))} win`;
  const said = won ? `<p class="serif" style="font-size:18px;margin:6px 0 4px">You: “${esc(step.item.label)}”</p>` : '';
  return sceneLayout(key, `
    <div class="stagehead"><span class="kicker c-${sceneColor(key)}">${esc(kicker)}</span><span class="mono muted">${esc(key)}</span>${proposalPill(scene)}</div>
    <h2 class="serif">${esc(titleOf(key))}</h2>
    ${said}
    <p class="muted">${esc(scene?.desc || '')}</p>`, `

function endingCard(run) {
  const key = engine.endingKey(run.state);

// What a race did toward the proposed unlocks.
function unlockNote(run, ending) {
  if (ui.rules.bj !== 'unlocks') return '';
  const played = new Set([...run.steps.map(step => step.scene), ending]);
  const met = UNLOCKS.flatMap(unlock => unlock.needs.filter(need => played.has(need.scene) || need.also?.some(also => played.has(also))).map(need => ({ unlock, need })));
  if (!met.length) return '';
  const unlocked = unlockedNow();
  return `<div style="margin-top:8px;font-size:14px">${met.map(({ unlock, need }) => `✓ ${esc(need.text)}. ${esc(unlock.title)}: ${unlocked[unlock.id] ? '<b>unlocked</b>' : 'still locked'}.`).join('<br>')}</div>`;
}

// A scene's card: its picture large on the left; on the right what it is (head), its pictures to
// click through, and what comes next (foot).
function sceneLayout(key, head, foot) {
  const { urls, placeholder } = scenePictures(key);
  let big;
  let thumbs = '';
  if (urls === null) big = `<div class="frame">${noArt('Loading…')}</div>`;
  else if (!urls.length) big = `<div class="frame">${cover(key)}</div>`;
  else {
    const i = ui.viewer.key === key ? Math.min(ui.viewer.i, urls.length - 1) : 0;
    const nav = urls.length > 1 ? `<button class="navbtn prev" data-act="view" data-arg="-1" aria-label="Previous picture">‹</button><button class="navbtn next" data-act="view" data-arg="1" aria-label="Next picture">›</button>` : '';
    const label = placeholder ? 'placeholder: no art yet' : SCENES[key]?.from ? `last picture of ${SCENES[key].from}` : `${i + 1} / ${urls.length}`;
    big = `<div class="frame" data-act="zoom" data-arg="${key}" data-here="1">${img(urls[i], [placeholderOf(SCENES[key]?.from || key)])}</div>${nav}<span class="count">${esc(label)}</span>`;
    if (urls.length > 1) thumbs = `<div class="thumbs">${urls.map((url, n) => `<button class="${n === i ? 'on' : ''}" data-act="view" data-arg="=${n}" aria-label="Picture ${n + 1}">${img(url)}</button>`).join('')}</div>`;
  }
  return `<div class="scene"><div class="big">${big}</div><div class="info">${head}${thumbs}${foot}</div></div>`;
}

function sidebar(run) {
  const s = run.state;
  const over = engine.isOver(s);
  const menu = over ? [] : engine.stakeMenu(s);
  const offered = new Set(menu.map(entry => entry.option));
  const winsLeft = STAKES_TO_FINISH - engine.yourWins(s);
  const playedKey = option => run.steps.find(step => step.action.t === 'win' && optionOf(step.scene) === option)?.scene;
  const node = (key, caption, status, color) => `
    <button class="node ${status} c-${color}" data-act="zoom" data-arg="${key}" title="${esc(titleOf(key))} · ${status === 'taken' ? 'taken' : status === 'next' ? 'on the menu now' : status === 'out' ? 'out of reach this race' : 'later'}">
      <span class="ring">${cover(key)}</span>${status === 'taken' ? '<span class="tick">✓</span>' : ''}<span class="cap">${esc(caption)}</span></button>`;
  const ladderRows = ladders().map(ladder => {
    // A rung as this race has it: once her top is off, the proposed topless blowjob takes rung 3.
    const shown = option => engine.toplessBlowjob(s, option) || (option === 'X3_UNDER' && engine.picked(s, 'X3_BJ'))
      ? { option: 'X3_BJ', key: 'WIN_X3_BJ__TOP_OFF' }
      : option === 'X4_BJ' && engine.picked(s, 'X4_SEX') ? { option: 'X4_SEX', key: 'WIN_X4_SEX__DRESSED' }
      : { option, key: engine.stakeKey(s, option) };
    const next = ladder.rungs.findIndex(([option]) => !engine.picked(s, shown(option).option));
    const taken = ladder.rungs.filter(([option]) => engine.picked(s, shown(option).option)).length;
    const nodes = ladder.rungs.map(([option], i) => {
      const rung = shown(option);
      if (engine.picked(s, rung.option)) return node(playedKey(rung.option) || rung.key, OPTION_SHORT[rung.option], 'taken', ladder.id);
      const status = over || i - next + 1 > winsLeft ? 'out' : offered.has(rung.option) ? 'next' : 'later';
      return node(rung.key, OPTION_SHORT[rung.option], status, ladder.id);

    return `<div class="lrow c-${ladder.id}"><div class="lname"><span class="dot c-${ladder.id}"></span>${ladder.name}<small>${taken}/4</small></div><div class="nodes">${nodes}</div></div>`;
  }).join('');

  const win = engine.yourWins(s) + 1;
  const mr1Gone = over || win > 3 || engine.picked(s, 'S3_SHORTS') || (engine.picked(s, 'L1_TRUTH') && !s.flags.has(BRA_SIZE_TRUTH));

    if (engine.picked(s, option)) return 'taken';

    if (option === 'MR1_KISS') return mr1Gone ? 'out' : 'later';
    if (option === 'MR1_FINGER' || option === 'MR1_NICE') return engine.picked(s, 'MR1_KISS') || (!mr1Gone && win <= 3) ? 'later' : 'out';
    return engine.picked(s, 'X1_BUTT') && engine.picked(s, 'X2_BREAST') ? 'out' : 'later';
  };
  const mrNodes = [['WIN_MR1_KISS', 'MR1_KISS', 'MR1 kiss'], ['WIN_MR1_FINGER', 'MR1_FINGER', 'MR1 finale']]
    .concat(ui.rules.mr1 ? [['WIN_MR1_NICE', 'MR1_NICE', 'MR1 nice']] : [])
    .concat([['WIN_MR3_INSPECT', 'MR3_INSPECT', 'Inspection']])
    .map(([key, option, caption]) => node(key, caption, mrStatus(option), 'mr')).join('');

  const hers = engine.herWins(s);
  const herKeys = [
    run.steps.find(step => step.scene?.startsWith('LOSE_P1'))?.scene || 'LOSE_P1_ASS_KISS__' + (engine.picked(s, 'S3_SHORTS') ? 'SHORTS_OFF' : 'SHORTS_ON'),
    'LOSE_P2_DICK_PIC',
    run.steps.find(step => step.scene?.startsWith('LOSE_P3'))?.scene || (engine.picked(s, 'S2_WALK') ? 'LOSE_P3A_YOUR_WALK' : 'LOSE_P3B_BENCH_GIRL'),
    'FORFEIT_NAKED_RUN__' + (engine.picked(s, 'S1_TOP') ? 'TOP_OFF' : 'DRESSED'),
  ];
  const herNodes = herKeys.map((key, i) => node(key, ['Ass kiss', 'Dick pic', i === 2 && key.includes('P3A') ? 'Your walk' : 'Bench girl', 'Your forfeit'][i],
    i < hers ? 'taken' : over ? 'out' : i === hers ? 'next' : 'later', 'her')).join('');

  const history = run.steps.map((step, i) => {
    const text = step.action.t === 'win'
      ? `You won · <b>${esc(OPTION_SHORT[optionOf(step.scene)] || step.scene)}</b>`
      : `She won · <b>${esc(step.scene ? titleOf(step.scene) : 'your forfeit')}</b>`;
    const on = (ui.view === 'scene' || ui.view === 'ending') && i === run.steps.length - 1;
    return `<li><button class="${on ? 'on' : ''}" data-act="rewind" data-arg="${i}"><span class="dot c-${step.action.t === 'win' ? optionLadder(optionOf(step.scene)) : 'her'}"></span><span><span class="when">Match ${i + 1}</span><br>${text}</span></button></li>`;
  }).join('');
  const end = over ? `<li><button class="${ui.view === 'ending' ? 'on' : ''}" data-act="ending"><span class="dot c-end"></span><span><span class="when">Ending</span><br><b>${esc(titleOf(engine.endingKey(s)))}</b></span></button></li>` : '';

  return `
    <div class="card">
      <h3>This race</h3>
      <div class="status">
        <div><div class="num">${engine.yourWins(s)}<small>/4</small></div><span class="muted">your stakes</span></div>
        <div><div class="num">${hers}<small>/4</small></div><span class="muted">her wins</span></div>
      </div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px"><span class="pill">${APPEARANCE[engine.appearance(s)]}</span>${s.flags.has(BRA_SIZE_TRUTH) ? '<span class="pill ladder c-mr">bra-size truth told</span>' : ''}${over ? '<span class="pill">race over</span>' : ''}</div>
    </div>
    ${ui.rules.bj === 'unlocks' ? unlocksPanel() : ''}
    <div class="card">
      <h3>The ladders</h3>
      <div class="ladders">${ladderRows}
        <div class="lrow c-mr"><div class="lname"><span class="dot c-mr"></span>Mini-routes</div><div class="nodes">${mrNodes}</div></div>
        <div class="lrow c-her"><div class="lname"><span class="dot c-her"></span>Her wins<small>${hers}/4</small></div><div class="nodes">${herNodes}</div></div>
      </div>
      <div class="legend"><span>✓ taken</span><span>dashed: on the menu now</span><span>faded: out of reach</span><span>click one to see it</span></div>
    </div>
    <div class="card">
      <h3>So far</h3>
      <ol class="hist"><li><button class="${ui.view === 'intro' ? 'on' : ''}" data-act="rewindStart"><span class="dot c-start"></span><span><span class="when">Start</span><br>The wager</span></button></li>${history}${end}</ol>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn small" data-act="newRace">New race</button><button class="btn small" data-act="random" ${over ? 'disabled' : ''}>Finish at random</button></div>
    </div>`;
}

// Every scene, what you've seen of it, how often races reach it, and the shortest way there.
function renderScenes() {
  const { seen, total } = seenCount();
  const inRace = new Set();
  const run = current();
  for (const step of run.steps) if (step.scene) inRace.add(step.scene);
  if (ui.view !== 'intro' || run.steps.length) inRace.add('INTRO_WAGER');
  if (engine.isOver(run.state) && ui.view === 'ending') inRace.add(engine.endingKey(run.state));
  const filter = name => `<button class="btn small" aria-pressed="${ui.filter === name}" data-act="filter" data-arg="${name}">${{ all: 'All', unseen: 'Not seen yet', seen: 'Seen' }[name]}</button>`;
  const groups = GROUPS.map(group => {
    const scenes = activeScenes().filter(scene => scene.group === group.id)
      .filter(scene => ui.filter === 'all' || (ui.filter === 'seen') === !!ui.seen[scene.key]);
    if (!scenes.length) return '';
    const color = { start: 'start', won: 'end', lost: 'her', after: 'end', her: 'her' }[group.id] || group.id;
    return `
      <div class="group c-${color}"><h3>${esc(group.name)}</h3><span>${esc(group.note || ladders().find(ladder => ladder.id === group.id).rungs.map(([option]) => OPTION_SHORT[option].toLowerCase()).join(' → '))}</span></div>
      <div class="grid">${scenes.map(scene => sceneTile(scene, inRace)).join('')}</div>`;
  }).join('');
  const removed = removedScenes();
  return `
    <div class="progress">
      <div><h2 class="serif" style="margin:0">${seen} of ${total} seen</h2><span class="muted">Everything the race can show, under the rules switched on above.</span></div>
      <div class="meter"><i style="width:${total ? (100 * seen / total).toFixed(1) : 0}%"></i></div>
      <div class="filters">${filter('all')}${filter('unseen')}${filter('seen')}</div>
      <button class="btn small ghost" data-act="resetSeen" title="Forget what you’ve seen">Reset</button>
    </div>
    ${groups || '<p class="muted">Nothing here.</p>'}
    ${removed.length ? `
      <div class="group c-end"><h3>Not in these rules</h3><span>scenes the proposals switched on take out of the race</span></div>
      <div class="grid removed">${removed.map(scene => sceneTile(scene, inRace, true)).join('')}</div>` : ''}`;
}
function sceneTile(scene, inRace, removed = false) {
  const times = ui.seen[scene.key] || 0;
  const races = analysis.sceneRaces[scene.key] || 0;
  const share = analysis.total ? races / analysis.total : 0;
  const locked = ui.rules.bj === 'unlocks' && scene.unlock && !unlockedNow()[scene.unlock];
  const reach = removed ? 'taken out by a proposal' : locked ? 'locked: see Unlocks on the Play tab' : races ? `in ${formatShare(share)} of races` : 'can’t happen under these rules';
  const flags = [times ? `<span class="pill seen">seen${times > 1 ? ' ×' + times : ''}</span>` : `<span class="pill">not seen</span>`];
  if (inRace.has(scene.key)) flags.push('<span class="pill new">this race</span>');
  if (proposalPill(scene)) flags.push(proposalPill(scene));
  return `
    <div class="scard c-${sceneColor(scene.key)} ${times ? '' : 'unseen'}">
      <button class="cover" data-act="zoom" data-arg="${scene.key}" aria-label="See ${esc(scene.title)}">${cover(scene.key)}<span class="flag">${flags.join('')}</span></button>
      <div class="body"><span class="t">${esc(scene.title)}</span><span class="mono muted">${esc(scene.key)}</span><span class="reach">${esc(reach)}</span>
        <span class="act">${!removed && analysis.routes[scene.key] ? `<button class="btn small" data-act="route" data-arg="${scene.key}">${times ? 'Play there again' : 'Show me a way'}</button>` : ''}</span></div>
    </div>`;
}
function formatShare(share) {
  if (share === 0) return '0%';
  if (share < 0.001) return '<0.1%';
  if (share < 0.1) return (100 * share).toFixed(1) + '%';
  return Math.round(100 * share) + '%';
}

// The whole space: how many races there are, where they end, and which pick sets earn each ending.
function renderRoutes() {
  const endingKeys = activeScenes().filter(scene => scene.group === 'won' || scene.group === 'lost').map(scene => scene.key);
  const youWin = endingKeys.filter(key => SCENES[key].group === 'won').reduce((n, key) => n + (analysis.endings[key]?.races || 0), 0);
  const endings = endingKeys.map(key => {
    const ending = analysis.endings[key];
    const races = ending?.races || 0;
    const sets = ending ? [...ending.sets.entries()].sort((a, b) => b[1] - a[1]) : [];
    const shown = sets.slice(0, 8).map(([set, n]) => `<span class="set">${set ? set.split(' ').map(option => `<span class="chip c-${optionLadder(option)}">${esc(OPTION_SHORT[option])}</span>`).join('') : '<span class="muted">no stakes</span>'}<em>${formatShare(n / analysis.total)}</em></span>`).join('');
    const more = sets.length > 8 ? `<span class="muted" style="font-size:12px;align-self:center">+${sets.length - 8} more sets</span>` : '';
    return `
      <div class="card ending c-${sceneColor(key)}">
        <button class="thumb" data-act="zoom" data-arg="${key}" aria-label="See ${esc(titleOf(key))}">${cover(key)}</button>
        <div><div class="stagehead"><b class="serif" style="font-size:18px">${esc(titleOf(key))}</b>${proposalPill(SCENES[key])}${ui.seen[key] ? '<span class="pill seen">seen</span>' : ''}</div>
          <div class="share"><span class="meter"><i style="width:${(100 * races / analysis.total).toFixed(2)}%"></i></span>${races ? `${races.toLocaleString()} races · ${formatShare(races / analysis.total)}` : 'no race ends here under these rules'}</div>
          <div class="sets">${shown}${more}</div></div>
        <div class="go">${analysis.routes[key] ? `<button class="btn small" data-act="route" data-arg="${key}">Play the shortest way</button>` : ''}</div>
      </div>`;
  }).join('');
  const frequent = activeScenes().filter(scene => !['start', 'won', 'lost'].includes(scene.group))
    .map(scene => ({ scene, share: (analysis.sceneRaces[scene.key] || 0) / analysis.total }))
    .sort((a, b) => a.share - b.share)
    .map(({ scene, share }) => `<div class="frow c-${sceneColor(scene.key)}"><span><span class="dot c-${sceneColor(scene.key)}"></span> ${esc(scene.title)}</span><span class="meter"><i style="width:${(100 * share).toFixed(2)}%"></i></span><span class="pct">${formatShare(share)}</span></div>`).join('');
  return `
    <p class="explain">A race ends at your 4th stake (she forfeits) or her 4th win (you forfeit). Each ladder only offers its next rung, so a ladder’s last scene needs all four of your stakes. Here a <b>race</b> is one order of wins, losses and picks; shares count every race as equally likely, which a player never is.</p>
    <div class="stats">
      <div class="card stat"><b>${analysis.total.toLocaleString()}</b><span>different races</span></div>
      <div class="card stat"><b>${analysis.pickSets}</b><span>different sets of your stakes</span></div>
      <div class="card stat"><b>${formatShare(youWin / analysis.total)}</b><span>of races end with her forfeit</span></div>
      <div class="card stat"><b>${endingKeys.filter(key => analysis.endings[key]).length}</b><span>endings</span></div>
    </div>
    <div class="group c-end"><h3>Where races end</h3><span>with the sets of stakes that get there (share of all races)</span></div>
    <div class="endings">${endings}</div>
    <div class="group c-end" style="margin-top:34px"><h3>How often each scene comes up</h3><span>rarest first</span></div>
    <div class="card pad freq">${frequent}</div>`;
}

function renderLightbox() {
  const box = document.getElementById('lightbox');
  if (!lightbox) {
    box.hidden = true;
    box.innerHTML = '';
    return;
  }
  const { urls, placeholder } = scenePictures(lightbox.key);
  const list = urls || [];
  const i = Math.min(lightbox.i, Math.max(0, list.length - 1));
  const picture = urls === null ? noArt('Loading…') : list.length ? `<img src="${esc(list[i])}" alt="" data-fb="${esc(placeholderOf(SCENES[lightbox.key]?.from || lightbox.key))}" onerror="pictureFailed(this)">` : noArt(SCENES[lightbox.key]?.proposal ? 'Proposed: no art' : 'No art yet');
  const nav = list.length > 1 ? `<button class="navbtn prev" data-act="lb" data-arg="-1" aria-label="Previous picture">‹</button><button class="navbtn next" data-act="lb" data-arg="1" aria-label="Next picture">›</button>` : '';
  const strip = list.length > 1 ? `<div class="strip">${list.map((url, n) => `<button class="${n === i ? 'on' : ''}" data-act="lb" data-arg="=${n}">${img(url)}</button>`).join('')}</div>` : '<div></div>';
  box.hidden = false;
  box.innerHTML = `
    <div class="top"><b class="serif">${esc(titleOf(lightbox.key))}</b><span class="mono" style="opacity:.7">${esc(lightbox.key)}</span>
      <span style="opacity:.8;font-size:13px">${placeholder ? 'placeholder' : list.length > 1 ? `${i + 1} / ${list.length}` : ''}</span>
      <button class="btn small" data-act="lb" data-arg="close">Close (Esc)</button></div>
    <div class="stage" data-act="lb" data-arg="close">${picture}${nav}</div>
    ${strip}`;
}

// --- events

document.addEventListener('click', event => {
  const target = event.target.closest('[data-act]');
  if (!target) return;
  const name = target.dataset.act;
  // A click on the picture itself shouldn't close the lightbox.
  if (name === 'lb' && target.dataset.arg === 'close' && target.classList.contains('stage') && event.target.tagName === 'IMG') return;
  if (!actions[name]) return;
  event.preventDefault();
  actions[name](target.dataset.arg, target);
  if (JSON.stringify(unlockedNow()) !== engineUnlocks) useRules();
  saveStore();
  render();
});
document.addEventListener('change', event => {
  const rule = event.target.dataset?.rule;
  if (!rule) return;
  ui.rules[rule] = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
  useRules();
  saveStore();
  render();
});
document.addEventListener('keydown', event => {
  if (event.target.closest?.('input, textarea')) return;
  if (lightbox) {
    if (event.key === 'Escape') actions.lb('close');
    else if (event.key === 'ArrowLeft') actions.lb('-1');
    else if (event.key === 'ArrowRight') actions.lb('1');
    else return;
  } else if (ui.tab === 'play' && ['intro', 'scene', 'ending'].includes(ui.view)) {
    if (event.key === 'ArrowLeft') actions.view('-1');
    else if (event.key === 'ArrowRight') actions.view('1');
    else return;
  } else {
    return;
  }
  event.preventDefault();
  saveStore();
  render();
});

function checkPictures() {
  const probe = new Image();
  probe.onerror = () => { ui.picsMissing = true; render(); };
  probe.src = placeholderOf('INTRO_WAGER');
}

loadStore();
useRules();
if (!ui.actions.length && ui.view === 'intro') see('INTRO_WAGER');
if (['intro', 'scene', 'ending'].includes(ui.view)) {
  const run = current();
  showScene(ui.view === 'intro' ? 'INTRO_WAGER' : ui.view === 'ending' ? engine.endingKey(run.state) : run.steps.at(-1).scene);
}
checkPictures();
render();
</script>
</body>
</html>
